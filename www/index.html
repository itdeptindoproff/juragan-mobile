<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <!-- user-scalable=no + maximum-scale=1 mematikan zoom di WKWebView native
         (iOS): mencegah double-tap-to-zoom yang "nyangkut" (ter-zoom & tidak
         bisa balik) pada area kosong, dan auto-zoom saat fokus input. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />

    <!-- PWA: manifest & theme -->
    <link rel="manifest" href="/portal/manifest.json" />
    <meta name="theme-color" content="#202C42" />
    <meta name="application-name" content="Juragan" />
    <meta name="description" content="Portal aplikasi internal Juragan" />

    <!-- PWA: iOS support (Safari tidak baca manifest sepenuhnya) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Juragan" />
    <link rel="apple-touch-icon" href="/portal/apple-touch-icon.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="96x96" href="/portal/favicon-96x96.png" />
    <link rel="icon" type="image/x-icon" href="/portal/favicon.ico" />
    <link rel="shortcut icon" href="/portal/favicon.ico" />

    <title>Juragan</title>

    <!-- Splash boot (C3): tampil saat aset dimuat, dihapus main.js setelah mount. -->
    <style>
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 40;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        background: #202c42;
        color: #fff;
        font-family: system-ui, -apple-system, sans-serif;
      }
      #boot-splash .bs-title {
        font-size: 1.75rem;
        font-weight: 700;
        letter-spacing: 0.02em;
      }
      #boot-splash .bs-spin {
        width: 28px;
        height: 28px;
        border: 3px solid rgba(255, 255, 255, 0.25);
        border-top-color: #fff;
        border-radius: 50%;
        animation: bs-rotate 0.8s linear infinite;
      }
      @keyframes bs-rotate {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
    <script type="module" crossorigin src="/assets/index-vBab4P0W.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-DVrpbn8N.css">
  </head>
  <body>
    <div id="app"></div>
    <div id="modals"></div>
    <div id="popovers"></div>

    <div id="boot-splash">
      <div class="bs-title">Juragan</div>
      <div class="bs-spin"></div>
    </div>

    <script> window.csrf_token = '{{ csrf_token }}'; </script>
    <script>
      // Defensive: kalau Frappe inject manifest/PWA meta-nya sendiri ke HTML
      // ini lewat layout wrapper, hapus semua yang BUKAN milik Juragan Home.
      (function () {
        document.querySelectorAll('link[rel="manifest"]').forEach(function (el) {
          if (!el.href.includes('/portal/manifest.json')) el.remove()
        })
        document.querySelectorAll('link[rel="apple-touch-icon"]').forEach(function (el) {
          if (!el.href.includes('/portal/')) el.remove()
        })
        document.querySelectorAll('meta[name="theme-color"]').forEach(function (el, i) {
          if (i > 0) el.remove()
        })
        document
          .querySelectorAll('meta[name="apple-mobile-web-app-title"]')
          .forEach(function (el) {
            if (el.content !== 'Juragan') el.remove()
          })
      })()
    </script>
  </body>
</html>
